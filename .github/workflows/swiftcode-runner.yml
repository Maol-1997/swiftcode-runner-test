name: SwiftCode runner
run-name: SwiftCode ${{ inputs.session_id }}
on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: swiftcode-runner
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Join tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: "TkF9qvWcNM41CNTRL-k43esbWdbd11CNTRL"
          audience: "api.tailscale.com/TkF9qvWcNM41CNTRL-k43esbWdbd11CNTRL"
          tags: "tag:swiftcode-runner"
          hostname: swiftcode-${{ inputs.session_id }}
          statedir: ${{ runner.temp }}/tailscale-state
      - name: Install SwiftCode
        env:
          SWIFTCODE_RUNNER_BOOTSTRAP: ${{ secrets.SWIFTCODE_RUNNER_SESSION }}
          SWIFTCODE_RUNNER_SESSION_ID: ${{ inputs.session_id }}
        run: |
          set +x
          sudo tailscale set --operator="$USER"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          const bootstrap = JSON.parse(process.env.SWIFTCODE_RUNNER_BOOTSTRAP);
          const url = new URL(bootstrap.gatewayUrl);
          if (bootstrap.sessionId !== process.env.SWIFTCODE_RUNNER_SESSION_ID ||
              !/^[a-f0-9]{16}$/.test(bootstrap.sessionId) ||
              url.protocol !== 'http:' || !/^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}$/.test(url.hostname) ||
              url.port !== '47380' || url.username || url.password || url.search || url.hash ||
              !/^\/[\w-]{43}$/.test(url.pathname) ||
              !/^[a-f0-9]{64}$/.test(bootstrap.artifactSha256)) throw new Error('Invalid runner bootstrap');
          url.pathname += '/artifact';
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(120000) })
            .catch(() => { throw new Error('Could not reach the local SwiftCode gateway'); });
          if (!response.ok) throw new Error('SwiftCode download failed');
          const body = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(body).digest('hex') !== bootstrap.artifactSha256)
            throw new Error('SwiftCode checksum mismatch');
          await writeFile(process.env.RUNNER_TEMP + '/swiftcode.tar.gz', body, { mode: 0o600 });
          NODE
          unset SWIFTCODE_RUNNER_BOOTSTRAP
          mkdir "$RUNNER_TEMP/swiftcode"
          tar -xzf "$RUNNER_TEMP/swiftcode.tar.gz" -C "$RUNNER_TEMP/swiftcode"
          cd "$RUNNER_TEMP/swiftcode"
          npm install --omit=dev --no-audit --no-fund
          mkdir "$RUNNER_TEMP/claude-cli" "$RUNNER_TEMP/codex-cli"
          printf '%s' '{"private":true,"allowScripts":{"@anthropic-ai/claude-code":true}}' > "$RUNNER_TEMP/claude-cli/package.json"
          printf '%s' '{"private":true,"allowScripts":{"@openai/codex":true}}' > "$RUNNER_TEMP/codex-cli/package.json"
          npm install --prefix "$RUNNER_TEMP/claude-cli" --no-audit --no-fund @anthropic-ai/claude-code > "$RUNNER_TEMP/claude-install.log" 2>&1 &
          claude_install_pid=$!
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund @openai/codex > "$RUNNER_TEMP/codex-install.log" 2>&1 &
          codex_install_pid=$!
          install_status=0
          wait "$claude_install_pid" || install_status=1
          wait "$codex_install_pid" || install_status=1
          test "$install_status" -eq 0
          echo "$RUNNER_TEMP/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftcode/bin" >> "$GITHUB_PATH"
      - name: Run SwiftCode
        env:
          SWIFTCODE_RUNNER_BOOTSTRAP: ${{ secrets.SWIFTCODE_RUNNER_SESSION }}
          SWIFTCODE_RUNNER_SESSION_ID: ${{ inputs.session_id }}
          T3CODE_HOME: ${{ runner.temp }}/swiftcode-home
        run: |
          set +x
          if (
            dns_name=$(tailscale status --json | node --input-type=module -e 'let data=""; for await (const part of process.stdin) data+=part; console.log(JSON.parse(data).Self.DNSName.replace(/\.$/, ""))') &&
            tailscale cert --cert-file "$RUNNER_TEMP/swiftcode.crt" --key-file "$RUNNER_TEMP/swiftcode.key" "$dns_name" &&
            swiftcode-server serve --github-runner --host 127.0.0.1 --port 3773 --tailscale-serve
          ) > "$RUNNER_TEMP/swiftcode-runner.log" 2>&1; then
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const bootstrap = JSON.parse(process.env.SWIFTCODE_RUNNER_BOOTSTRAP);
          const log = await readFile(process.env.RUNNER_TEMP + '/swiftcode-runner.log', 'utf8');
          await fetch(bootstrap.gatewayUrl + '/session', {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(10000),
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ busy: false, lastActivityAt: Date.now(), startupError: log.slice(-1024) })
          }).catch(() => {});
          NODE
          exit 1
